name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.LTOTS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.LTOTS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ltots.jks"

      - name: Audio engine tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        env:
          LTOTS_KEYSTORE_FILE: ${{ env.HAS_KEY == 'true' && format('{0}/ltots.jks', runner.temp) || '' }}
          LTOTS_KEYSTORE_PASSWORD: ${{ secrets.LTOTS_KEYSTORE_PASSWORD }}
          LTOTS_KEY_ALIAS: ${{ secrets.LTOTS_KEY_ALIAS }}
          LTOTS_KEY_PASSWORD: ${{ secrets.LTOTS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION="0.1.${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LToTS.apk
          cp out/LToTS.apk "out/LToTS-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: LToTS-${{ steps.apk.outputs.version }}
          path: out/LToTS-${{ steps.apk.outputs.version }}.apk

      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.apk.outputs.version }}"
          gh release create "v$V" out/LToTS.apk "out/LToTS-$V.apk" \
            --title "LToTS $V" \
            --notes "Automatic build of $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)" \
            --latest

      - name: Signing key missing
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::No signing key secrets set, so no release was published. Add the LTOTS_* secrets (see README) and re-run this workflow."
